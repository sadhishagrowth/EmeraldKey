<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Welcome to EmeraldKey." />
    <title>EmeraldKey</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f0f8f4;
        color: #123d2c;
        font-family: system-ui, sans-serif;
      }
      main {
        width: 100%;
        max-width: 640px;
        padding: clamp(24px, 6vw, 64px);
        border: 1px solid #cce5d7;
        border-radius: 24px;
        background: white;
        text-align: center;
      }
      h1 { margin: 0 0 16px; font-size: clamp(32px, 7vw, 56px); }
      p { margin: 0; color: #496657; font-size: 18px; line-height: 1.6; }
    </style>
  </head>
  <body>
    <main>
      <h1>EmeraldKey</h1>
      <p>Welcome to EmeraldKey. Your next chapter starts here.</p>
    </main>
  </body>
</html>
